[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepethogram"
version = "0.4.0"
description = "Temporal action detection for biology"
readme = "README.md"
authors = [
    {name = "Jim Bohnslav", email = "jbohnslav@gmail.com"},
]
requires-python = ">=3.9,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "chardet",
    "h5py",
    "kornia>=0.5",
    "matplotlib",
    "numpy",
    "omegaconf>=2",
    "opencv-python-headless",
    "opencv-transforms",
    "pandas>=1.5,<2.1",
    "PySide6>=6.6.0",
    "scikit-learn>=1.2,<1.4",
    "scipy>=1.9,<1.11",
    "torch==2.8.0",
    "tensorboard",
    "tqdm",
    "vidio",
    "pytorch_lightning==2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pre-commit>=2.20.0,<3.0.0",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "pytest-xvfb",
    "gdown",
    "ty>=0.0.1a17",
]

[project.scripts]
deepethogram = "deepethogram.gui.main:entry"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["deepethogram*"]

[tool.ruff]
# Python version compatibility
target-version = "py311"

# Same as Black.
line-length = 120

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "tests/",
    "docs/"
]

[tool.ruff.lint]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
