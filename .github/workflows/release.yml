name: Release on Version Bump

on:
  push:
    branches: [master]
    paths: [pyproject.toml]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        shell: bash
        run: |
          # NOTE: deepethogram currently defines its version in setup.py.
          # This workflow assumes a future move to [project].version in pyproject.toml.
          get_version() {
            python3 -c "import pathlib, sys, tomllib; data = tomllib.loads(pathlib.Path(sys.argv[1]).read_text()); print(data.get('project', {}).get('version', ''))" "$1"
          }

          new="$(get_version pyproject.toml)"
          if git show HEAD^:pyproject.toml > /tmp/prev.toml 2>/dev/null; then
            old="$(get_version /tmp/prev.toml)"
          else
            old=""
          fi

          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old=$old" >> "$GITHUB_OUTPUT"

          if [ -z "$new" ]; then
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$new" = "$old" ]; then
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_version=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if release conditions are not met
        if: steps.version.outputs.changed != 'true'
        shell: bash
        run: |
          if [ "${{ steps.version.outputs.has_version }}" != "true" ]; then
            echo "pyproject.toml does not define [project].version yet; skipping release."
          else
            echo "Version unchanged; skipping release."
          fi

      - name: Set up uv
        if: steps.version.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Build distributions
        if: steps.version.outputs.changed == 'true'
        run: |
          rm -rf dist/
          uv build

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.new }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.whl --clobber
          else
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --generate-notes \
              dist/*.tar.gz dist/*.whl
          fi

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
