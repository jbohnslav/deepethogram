name: Pre-commit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        enable-cache: true

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --locked --dev

    - name: Run Ruff
      run: uv run ruff check .

    - name: Run pre-commit
      run: uvx pre-commit@4.4.0 run --all-files --show-diff-on-failure --color=always
